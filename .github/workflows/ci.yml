name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: conduit_collections_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d conduit_collections_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      JWT_KEY: ci-collections-test-key
      PORT: 3101
      DEV_DB_USERNAME: postgres
      DEV_DB_PASSWORD: postgres
      DEV_DB_NAME: conduit_collections_dev
      DEV_DB_HOSTNAME: 127.0.0.1
      DEV_DB_DIALECT: postgres
      TEST_DB_USERNAME: postgres
      TEST_DB_PASSWORD: postgres
      TEST_DB_NAME: conduit_collections_test
      TEST_DB_HOSTNAME: 127.0.0.1
      TEST_DB_DIALECT: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Apply test database migrations
        run: npm run sqlz -- db:migrate --env test
      - name: Unit and API tests
        run: npm test -- --run --silent
      - name: Build frontend
        run: npm run build -w frontend
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser E2E
        run: npm run test:e2e
      - name: Save browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
